name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: apps/web
        run: npm run build

      - name: Run Go tests
        run: |
          go -C packages/types test ./...
          go -C services/gateway test ./...
          go -C services/panta-adapter test ./...

      - name: Run Python tests
        working-directory: services/intelligence
        run: |
          python -m pip install -r requirements.txt
          pytest -q

      - name: Run Rust tests
        run: cargo test --manifest-path services/market-engine/Cargo.toml

      - name: Run Foundry tests
        working-directory: contracts/evm
        run: forge test
